name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'

      - name: Provide firebase_options stub for CI
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - name: Provide google-services stub for CI
        run: cp android/app/google-services.json.example android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK (compile sanity)
        run: flutter build apk --debug --target-platform android-arm64
